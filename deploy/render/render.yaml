# Render Blueprint for the Embed Lab backend, free Docker web service.
#
# Render auto-discovers a render.yaml only at the repo root. This file lives
# under deploy/render/ instead (see deploy/README.md for why), so when
# creating the Blueprint in the Render dashboard, point it at THIS path
# explicitly ("New +" -> "Blueprint" -> pick the repo -> set the Blueprint
# file path to deploy/render/render.yaml). Manual "New +" -> "Web Service"
# setup works too and does not need this file at all -- see the README.
services:
  - type: web
    name: embed-lab-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/demos
    autoDeployTrigger: commit
    envVars:
      - key: HF_HUB_OFFLINE
        value: "1"
